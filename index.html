<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hill Climb Racing - Física, Rampas e Obstáculos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            text-align: center;
        }

        canvas {
            background-color: #5c940d; /* Será desenhado o céu dinamicamente */
            border: 4px solid #fff;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }

        .controls {
            margin-top: 15px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid #444;
        }

        span {
            color: #ff3333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h2>Hill Climb Racing - Física & Obstáculos</h2>
        <canvas id="gameCanvas" width="900" height="450"></canvas>
        <div class="controls">
            <p><strong>Controles no Chão:</strong> ➡️ Acelerar | ⬅️ Ré / Freio</p>
            <p><strong>Controles no Ar (Física de Inclinação):</strong> ➡️ Girar p/ Frente | ⬅️ Girar p/ Trás (Empinar)</p>
            <p><span>Cuidado para não capotar de cabeça para baixo!</span></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- CONFIGURAÇÕES DO CARRO ---
        const car = {
            x: 200,
            y: 100,
            vx: 0,
            vy: 0,
            angle: 0,          // Ângulo de rotação do carro
            vAngle: 0,         // Velocidade da rotação (no ar)
            width: 50,
            height: 18,
            radius: 12,        // Tamanho das rodas
            speed: 0.25,       // Potência do motor
            friction: 0.98,    // Resistência do ar/atrito
            gravity: 0.35,     // Gravidade aplicada
            isGrounded: false
        };

        // --- OBSTÁCULOS (Caixas com física simples) ---
        const boxes = [
            { x: 600, y: 0, size: 25, vx: 0, vy: 0 },
            { x: 1200, y: 0, size: 30, vx: 0, vy: 0 },
            { x: 1235, y: 0, size: 25, vx: 0, vy: 0 }, // Duas caixas juntas
            { x: 2200, y: 0, size: 35, vx: 0, vy: 0 }
        ];

        // Teclado
        const keys = { ArrowRight: false, ArrowLeft: false };
        window.addEventListener("keydown", (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { if (e.key in keys) keys[e.key] = false; });

        // --- TERRENO COM RAMPAS ARTIFICIAIS ---
        function getTerrain(x) {
            // Base do terreno usando ondas normais (seno)
            let base = canvas.height - 120 + Math.sin(x * 0.006) * 60 + Math.sin(x * 0.002) * 40;
            
            // Rampa 1 (por volta do X: 800)
            if (x > 750 && x < 900) {
                let rampaProgresso = (x - 750) / 150;
                base -= rampaProgresso * 70; // Eleva o terreno abruptamente para criar a rampa
            }
            
            // Rampa 2 gigante (por volta do X: 1700)
            if (x > 1600 && x < 1850) {
                let rampaProgresso = (x - 1600) / 250;
                base -= rampaProgresso * 110;
            }

            return base;
        }

        // --- LOOP PRINCIPAL ---
        function update() {
            // 1. INPUTS & FÍSICA DE ROTAÇÃO
            if (car.isGrounded) {
                // No chão: seta direita corre, seta esquerda freia/ré
                if (keys.ArrowRight) car.vx += car.speed;
                if (keys.ArrowLeft) car.vx -= car.speed;
                car.vAngle *= 0.5; // Alinha com o chão
            } else {
                // No ar: setas controlam a rotação/inclinação do carro
                if (keys.ArrowRight) car.vAngle += 0.008;
                if (keys.ArrowLeft) car.vAngle -= 0.008;
            }

            // Aplicando gravidade e movimentação do carro
            car.vx *= car.friction;
            car.vy += car.gravity;
            car.angle += car.vAngle;
            car.vAngle *= 0.95; // Atrito de rotação

            car.x += car.vx;
            car.y += car.vy;

            // 2. COLISÃO DO CARRO COM O CHÃO (Alinhamento de inclinação)
            const groundY = getTerrain(car.x);
            // Pegamos um ponto ligeiramente à frente para calcular a inclinação do chão
            const groundAheadY = getTerrain(car.x + 15); 
            const targetAngle = Math.atan2(groundAheadY - groundY, 15);

            if (car.y + car.radius >= groundY) {
                car.y = groundY - car.radius;
                car.vy = 0;
                car.isGrounded = true;
                
                // Suaviza o ângulo do carro para colar no relevo da montanha
                car.angle = car.angle * 0.6 + targetAngle * 0.4;
            } else {
                car.isGrounded = false;
            }

            // 3. FÍSICA E ATUALIZAÇÃO DOS OBSTÁCULOS (CAIXAS)
            boxes.forEach(box => {
                box.vy += car.gravity; // Gravidade na caixa
                box.vx *= 0.95;        // Atrito no chão

                box.x += box.vx;
                box.y += box.vy;

                // Colisão da caixa com o chão
                const boxGround = getTerrain(box.x);
                if (box.y + box.size >= boxGround) {
                    box.y = boxGround - box.size;
                    box.vy = 0;
                }

                // COLISÃO: Carro batendo na caixa
                let distParaCaixa = Math.abs(car.x - box.x);
                if (distParaCaixa < car.width / 2 + box.size / 2 && Math.abs(car.y - box.y) < box.size) {
                    // Empurra a caixa com base na velocidade do carro
                    box.vx = car.vx * 1.2;
                    box.vy = car.vy - 2; // Dá um leve pulinho ao impacto
                    car.vx *= 0.7; // Carro perde um pouco de velocidade ao bater
                }
            });

            // 4. DESENHO DO CENÁRIO (RENDER)
            // Limpa com o azul do céu
            ctx.fillStyle = "#74b9ff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Câmera lateral seguindo o carro
            ctx.save();
            ctx.translate(-car.x + 200, 0);

            // Desenhar Montanhas / Chão
            ctx.beginPath();
            ctx.fillStyle = "#8c7ae6"; // Terra escura/Sub-solo
            for (let x = car.x - 300; x < car.x + 800; x += 4) {
                let ty = getTerrain(x);
                if (x === car.x - 300) ctx.moveTo(x, canvas.height);
                ctx.lineTo(x, ty);
            }
            ctx.lineTo(car.x + 800, canvas.height);
            ctx.fill();

            // Desenhar Linha da Grama
            ctx.beginPath();
            ctx.strokeStyle = "#4cd137"; // Grama viva
            ctx.lineWidth = 8;
            for (let x = car.x - 300; x < car.x + 800; x += 4) {
                let ty = getTerrain(x);
                if (x === car.x - 300) ctx.moveTo(x, ty);
                ctx.lineTo(x, ty);
            }
            ctx.stroke();

            // Desenhar as Caixas (Obstáculos)
            boxes.forEach(box => {
                ctx.fillStyle = "#e67e22"; // Cor de madeira
                ctx.fillRect(box.x - box.size/2, box.y, box.size, box.size);
                // Detalhe de "X" na caixa
                ctx.strokeStyle = "#d35400";
                ctx.lineWidth = 2;
                ctx.strokeRect(box.x - box.size/2, box.y, box.size, box.size);
            });

            // 5. DESENHAR O CARRO ROTACIONADO (FÍSICA DE INCLINAÇÃO)
            ctx.save();
            ctx.translate(car.x, car.y); // Move a origem para o centro do carro
            ctx.rotate(car.angle);        // Gira todo o desenho do carro

            // Chassi Principal
            ctx.fillStyle = "#e74c3c"; // Vermelho
            ctx.fillRect(-car.width / 2, -car.height, car.width, car.height);
            
            // Vidro / Teto
            ctx.fillStyle = "#3498db";
            ctx.fillRect(0, -car.height - 10, 18, 10);

            // Rodas (Desenhadas em relação ao centro rotacionado)
            ctx.fillStyle = "#2d3436";
            
            ctx.beginPath(); // Roda Traseira
            ctx.arc(-car.width / 3, 0, car.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#b2bec3"; // Aro
            ctx.beginPath(); ctx.arc(-car.width / 3, 0, car.radius/2, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#2d3436";
            ctx.beginPath(); // Roda Dianteira
            ctx.arc(car.width / 3, 0, car.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#b2bec3"; // Aro
            ctx.beginPath(); ctx.arc(car.width / 3, 0, car.radius/2, 0, Math.PI * 2); ctx.fill();

            ctx.restore(); // Restaura rotação do carro
            ctx.restore(); // Restaura câmera do cenário

            requestAnimationFrame(update);
        }

        // Iniciar
        update();
    </script>
</body>
</html>
