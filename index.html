<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hill Climb Racing - Comandos Completos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            text-align: center;
        }

        canvas {
            background-color: #74b9ff;
            border: 4px solid #fff;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }

        .controls {
            margin-top: 12px;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid #444;
            font-size: 14px;
        }

        .key {
            background: #444;
            padding: 2px 6px;
            border-radius: 4px;
            border-bottom: 3px solid #111;
            font-family: monospace;
            font-weight: bold;
            color: #fff;
        }

        .danger {
            color: #ff7675;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h2>Hill Climb Racing - Clone</h2>
        <canvas id="gameCanvas" width="900" height="450"></canvas>
        
        <div class="controls">
            <p><strong>Controles no Chão:</strong> <span class="key">➡️</span> Acelerar | <span class="key">⬅️</span> Ré</p>
            <p><strong>Controles no Ar:</strong> <span class="key">➡️</span> Girar p/ Frente | <span class="key">⬅️</span> Girar p/ Trás</p>
            <p><strong>Novos Comandos:</strong> <span class="key">Espaço</span> Freio de Mão | <span class="key">R</span> Reiniciar Jogo</p>
            <p class="danger">Se capotar ou travar, aperte R!</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Estado inicial do carro para podermos resetar depois
        const initialCarState = {
            x: 200,
            y: 100,
            vx: 0,
            vy: 0,
            angle: 0,
            vAngle: 0,
            width: 50,
            height: 18,
            radius: 12,
            speed: 0.25,
            friction: 0.98,
            gravity: 0.35,
            isGrounded: false
        };

        // Copia as propriedades para o objeto do carro em execução
        let car = { ...initialCarState };

        // Posição inicial das caixas para resetar
        const initialBoxes = [
            { x: 600, y: 0, size: 25, vx: 0, vy: 0 },
            { x: 1200, y: 0, size: 30, vx: 0, vy: 0 },
            { x: 1235, y: 0, size: 25, vx: 0, vy: 0 },
            { x: 2200, y: 0, size: 35, vx: 0, vy: 0 }
        ];
        
        let boxes = JSON.parse(JSON.stringify(initialBoxes));

        // Registro de teclas pressionadas
        const keys = { ArrowRight: false, ArrowLeft: false, Space: false };

        window.addEventListener("keydown", (e) => {
            // Atalho para Reiniciar
            if (e.key.toLowerCase() === 'r') {
                resetGame();
            }
            // Mapeia as setas e o espaço
            if (e.key === "ArrowRight") keys.ArrowRight = true;
            if (e.key === "ArrowLeft") keys.ArrowLeft = true;
            if (e.key === " " || e.key === "Spacebar") keys.Space = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight") keys.ArrowRight = false;
            if (e.key === "ArrowLeft") keys.ArrowLeft = false;
            if (e.key === " " || e.key === "Spacebar") keys.Space = false;
        });

        // Função que reconstrói o estado do jogo
        function resetGame() {
            car = { ...initialCarState };
            boxes = JSON.parse(JSON.stringify(initialBoxes));
        }

        // Gera o terreno e as rampas
        function getTerrain(x) {
            let base = canvas.height - 120 + Math.sin(x * 0.006) * 60 + Math.sin(x * 0.002) * 40;
            // Rampa 1
            if (x > 750 && x < 900) {
                let rampaProgresso = (x - 750) / 150;
                base -= rampaProgresso * 70;
            }
            // Rampa 2
            if (x > 1600 && x < 1850) {
                let rampaProgresso = (x - 1600) / 250;
                base -= rampaProgresso * 110;
            }
            return base;
        }

        function update() {
            // AÇÕES DOS COMANDOS
            if (car.isGrounded) {
                if (keys.ArrowRight) car.vx += car.speed;
                if (keys.ArrowLeft) car.vx -= car.speed;
                
                // Comando de Freio de mão (Para o carro rapidamente no chão)
                if (keys.Space) {
                    car.vx *= 0.85; 
                }
                car.vAngle *= 0.5;
            } else {
                // Comandos no ar (Giro)
                if (keys.ArrowRight) car.vAngle += 0.008;
                if (keys.ArrowLeft) car.vAngle -= 0.008;
            }

            // Física básica
            car.vx *= car.friction;
            car.vy += car.gravity;
            car.angle += car.vAngle;
            car.vAngle *= 0.95;

            car.x += car.vx;
            car.y += car.vy;

            // Colisão com solo
            const groundY = getTerrain(car.x);
            const groundAheadY = getTerrain(car.x + 15); 
            const targetAngle = Math.atan2(groundAheadY - groundY, 15);

            if (car.y + car.radius >= groundY) {
                car.y = groundY - car.radius;
                car.vy = 0;
                car.isGrounded = true;
                car.angle = car.angle * 0.6 + targetAngle * 0.4;
            } else {
                car.isGrounded = false;
            }

            // Atualizar Caixas
            boxes.forEach(box => {
                box.vy += car.gravity;
                box.vx *= 0.95;
                box.x += box.vx;
                box.y += box.vy;

                const boxGround = getTerrain(box.x);
                if (box.y + box.size >= boxGround) {
                    box.y = boxGround - box.size;
                    box.vy = 0;
                }

                // Colisão carro -> caixa
                let distParaCaixa = Math.abs(car.x - box.x);
                if (distParaCaixa < car.width / 2 + box.size / 2 && Math.abs(car.y - box.y) < box.size) {
                    box.vx = car.vx * 1.3;
                    box.vy = car.vy - 2;
                    car.vx *= 0.7; 
                }
            });

            // RENDERIZAÇÃO (Desenho)
            ctx.fillStyle = "#74b9ff"; // Céu
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-car.x + 200, 0);

            // Desenhar chão
            ctx.beginPath();
            ctx.fillStyle = "#8c7ae6"; 
            for (let x = car.x - 300; x < car.x + 800; x += 4) {
                let ty = getTerrain(x);
                if (x === car.x - 300) ctx.moveTo(x, canvas.height);
                ctx.lineTo(x, ty);
            }
            ctx.lineTo(car.x + 800, canvas.height);
            ctx.fill();

            // Grama
            ctx.beginPath();
            ctx.strokeStyle = "#4cd137"; 
            ctx.lineWidth = 8;
            for (let x = car.x - 300; x < car.x + 800; x += 4) {
                let ty = getTerrain(x);
                if (x === car.x - 300) ctx.moveTo(x, ty);
                ctx.lineTo(x, ty);
            }
            ctx.stroke();

            // Caixas
            boxes.forEach(box => {
                ctx.fillStyle = "#e67e22";
                ctx.fillRect(box.x - box.size/2, box.y, box.size, box.size);
                ctx.strokeStyle = "#d35400";
                ctx.lineWidth = 2;
                ctx.strokeRect(box.x - box.size/2, box.y, box.size, box.size);
            });

            // Desenhar Carro
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);

            ctx.fillStyle = "#e74c3c"; 
            ctx.fillRect(-car.width / 2, -car.height, car.width, car.height);
            
            ctx.fillStyle = "#3498db";
            ctx.fillRect(0, -car.height - 10, 18, 10);

            // Rodas
            ctx.fillStyle = "#2d3436";
            ctx.beginPath(); ctx.arc(-car.width / 3, 0, car.radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#b2bec3";
            ctx.beginPath(); ctx.arc(-car.width / 3, 0, car.radius/2, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#2d3436";
            ctx.beginPath(); ctx.arc(car.width / 3, 0, car.radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#b2bec3";
            ctx.beginPath(); ctx.arc(car.width / 3, 0, car.radius/2, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
            ctx.restore();

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
