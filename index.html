<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hill Climb Racing - Garagem & Upgrades</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: 'Arial Black', Gadget, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            text-align: center;
        }

        canvas {
            border: 6px solid #fff;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: block;
        }

        /* TELA DA GARAGEM / MENU */
        #garage-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 15px;
            box-sizing: border-box;
            border: 6px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            z-index: 10;
        }

        .garage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .garage-title { font-size: 32px; text-shadow: 3px 3px 0 #000; color: #fffa65; }
        .garage-coins { font-size: 24px; color: #f1c40f; text-shadow: 2px 2px 0 #000; }

        .upgrades-container {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .upgrade-card {
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 15px;
            width: 200px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .upgrade-name { font-size: 16px; color: #fff; margin-bottom: 5px; }
        .upgrade-level { font-size: 14px; color: #3498db; margin-bottom: 10px; }
        
        .level-bars {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-bottom: 15px;
        }
        .bar { width: 12px; height: 12px; background: #444; border: 1px solid #fff; }
        .bar.fill { background: #2ecc71; }

        .btn-upgrade {
            background: #e67e22;
            border: 2px solid #fff;
            border-radius: 5px;
            color: white;
            padding: 8px 12px;
            font-family: 'Arial Black';
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 3px 0 #a04000;
        }
        .btn-upgrade:active { transform: translateY(3px); box-shadow: none; }
        .btn-upgrade:disabled { background: #7f8c8d; box-shadow: none; cursor: not-allowed; }

        .btn-start {
            background: #2ecc71;
            border: 4px solid #fff;
            border-radius: 12px;
            color: white;
            padding: 15px 60px;
            font-size: 28px;
            font-family: 'Arial Black';
            cursor: pointer;
            align-self: center;
            box-shadow: 0 6px 0 #27ae60;
            text-shadow: 2px 2px 0 #000;
        }
        .btn-start:active { transform: translateY(6px); box-shadow: none; }

        /* HUD DO JOGO */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            text-align: left;
            text-shadow: 2px 2px 0px #000;
            font-size: 18px;
            pointer-events: none;
            z-index: 5;
        }

        .hud-item { margin-bottom: 5px; display: flex; align-items: center; }
        .coin-txt { color: #f1c40f; }
        .fuel-txt { color: #e74c3c; }

        .fuel-bar-container {
            width: 150px; height: 15px; background: #555;
            border: 2px solid #fff; border-radius: 5px;
            display: inline-block; margin-left: 10px; overflow: hidden;
        }
        .fuel-bar { width: 100%; height: 100%; background: #2ecc71; }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            z-index: 8;
        }
        #game-over-screen h1 { color: #e74c3c; font-size: 40px; margin-bottom: 10px; text-shadow: 3px 3px 0 #000; }
        .btn-menu {
            background: #34495e; border: 3px solid #fff; border-radius: 8px;
            color: white; padding: 10px 25px; font-family: 'Arial Black';
            font-size: 18px; cursor: pointer; margin-top: 15px;
        }

        .instructions { margin-top: 10px; font-family: Arial, sans-serif; font-size: 13px; color: #bbb; }
        .key { background: #444; padding: 2px 5px; border-radius: 3px; color: #fff; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="garage-screen">
            <div class="garage-header">
                <div class="garage-title">GARAGEM</div>
                <div class="garage-coins">🪙 <span id="garage-coins-txt">0</span></div>
            </div>

            <div class="upgrades-container">
                <div class="upgrade-card">
                    <div class="upgrade-name">MOTOR (GAS)</div>
                    <div class="upgrade-level">Nível <span id="lvl-motor">1</span>/5</div>
                    <div class="level-bars" id="bars-motor"></div>
                    <button class="btn-upgrade" id="btn-upgrade-motor" onclick="buyUpgrade('motor')">4.000</button>
                </div>
                <div class="upgrade-card">
                    <div class="upgrade-name">SUSPENSÃO</div>
                    <div class="upgrade-level">Nível <span id="lvl-sus">1</span>/5</div>
                    <div class="level-bars" id="bars-sus"></div>
                    <button class="btn-upgrade" id="btn-upgrade-sus" onclick="buyUpgrade('sus')">3.000</button>
                </div>
                <div class="upgrade-card">
                    <div class="upgrade-name">PNEUS</div>
                    <div class="upgrade-level">Nível <span id="lvl-pneu">1</span>/5</div>
                    <div class="level-bars" id="bars-pneu"></div>
                    <button class="btn-upgrade" id="btn-upgrade-pneu" onclick="buyUpgrade('pneu')">2.500</button>
                </div>
            </div>

            <button class="btn-start" onclick="startGame()">CORRER</button>
        </div>

        <div class="hud">
            <div class="hud-item coin-txt">🪙 MOEDAS: <span id="coin-score">0</span></div>
            <div class="hud-item" style="color: #fff">🏁 DISTÂNCIA: <span id="dist-score">0</span>m</div>
            <div class="hud-item fuel-txt">
                GAS: 
                <div class="fuel-bar-container">
                    <div id="fuel-gauge" class="fuel-bar"></div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="900" height="450"></canvas>

        <div id="game-over-screen">
            <h1 id="fail-reason">GAME OVER</h1>
            <p>Moedas coletadas nesta rodada!</p>
            <button class="btn-menu" onclick="backToGarage()">VOLTAR P/ GARAGEM</button>
        </div>
        
        <div class="instructions">
            Controles: <span class="key">➡️</span> ACELERAR | <span class="key">⬅️</span> FREIO/RÉ | <span class="key">⬆️</span> PULAR
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Elementos DOM
        const coinScoreEl = document.getElementById("coin-score");
        const distScoreEl = document.getElementById("dist-score");
        const fuelGaugeEl = document.getElementById("fuel-gauge");
        const gameOverScreen = document.getElementById("game-over-screen");
        const failReasonEl = document.getElementById("fail-reason");
        const garageScreen = document.getElementById("garage-screen");
        const garageCoinsTxt = document.getElementById("garage-coins-txt");

        // --- SISTEMA ECONÔMICO E UPGRADES ---
        let totalCoins = 15000; // Começa com bônus para você testar os upgrades!
        let upgrades = { motor: 1, sus: 1, pneu: 1 };
        let costs = { motor: 4000, sus: 3000, pneu: 2500 };

        let inGame = false;

        // Estado do Carro Variável pelos Upgrades
        const initialCarState = {
            x: 200, y: 100, vx: 0, vy: 0, angle: 0, vAngle: 0,
            width: 54, height: 18, radius: 12,
            speed: 0.25, jumpForce: -11.0, friction: 0.98, gravity: 0.4,
            isGrounded: false, fuel: 100, coins: 0, distance: 0, alive: true
        };
        let car = { ...initialCarState };

        let particles = [];
        let spawnMarkers = {};
        let activeItems = [];
        let obstacles = [];

        const keys = { ArrowRight: false, ArrowLeft: false, ArrowUp: false };

        // Atualiza os blocos visuais de nível na garagem
        function updateGarageUI() {
            garageCoinsTxt.innerText = totalCoins.toLocaleString('pt-BR');
            
            ['motor', 'sus', 'pneu'].forEach(type => {
                document.getElementById(`lvl-${type === 'sus' ? 'sus' : type === 'pneu' ? 'pneu' : 'motor'}`).innerText = upgrades[type];
                let container = document.getElementById(`bars-${type === 'sus' ? 'sus' : type === 'pneu' ? 'pneu' : 'motor'}`);
                container.innerHTML = '';
                for(let i = 1; i <= 5; i++) {
                    let bar = document.createElement('div');
                    bar.className = 'bar' + (i <= upgrades[type] ? ' fill' : '');
                    container.appendChild(bar);
                }

                let btn = document.getElementById(`btn-upgrade-${type === 'sus' ? 'sus' : type === 'pneu' ? 'pneu' : 'motor'}`);
                if (upgrades[type] >= 5) {
                    btn.innerText = "MAX";
                    btn.disabled = true;
                } else {
                    btn.innerText = costs[type].toLocaleString('pt-BR');
                    btn.disabled = totalCoins < costs[type];
                }
            });
        }

        function buyUpgrade(type) {
            if (totalCoins >= costs[type] && upgrades[type] < 5) {
                totalCoins -= costs[type];
                upgrades[type]++;
                costs[type] = Math.floor(costs[type] * 1.5); // Aumenta o preço do próximo nível
                updateGarageUI();
            }
        }

        function startGame() {
            garageScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            
            // Aplica os multiplicadores de upgrade baseados no nível adquirido
            car = { ...initialCarState };
            car.speed += (upgrades.motor - 1) * 0.05;      // Mais velocidade
            car.friction += (upgrades.pneu - 1) * 0.003;   // Mais aderência/menos derrapagem
            // Suspensão melhorada absorve mais o ângulo de impacto
            
            activeItems = [];
            obstacles = [];
            particles = [];
            spawnMarkers = {};
            coinScoreEl.innerText = "0";
            distScoreEl.innerText = "0";
            fuelGaugeEl.style.width = "100%";
            fuelGaugeEl.style.background = "#2ecc71";
            
            inGame = true;
        }

        function backToGarage() {
            totalCoins += car.coins; // Consolida moedas coletadas na corrida
            gameOverScreen.style.display = "none";
            garageScreen.style.display = "flex";
            inGame = false;
            updateGarageUI();
        }

        // Eventos Teclado
        window.addEventListener("keydown", (e) => {
            if (!car.alive || !inGame) return;
            if (e.key === "ArrowRight") keys.ArrowRight = true;
            if (e.key === "ArrowLeft") keys.ArrowLeft = true;
            if (e.key === "ArrowUp" || e.key.toLowerCase() === 'w') keys.ArrowUp = true;
        });
        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight") keys.ArrowRight = false;
            if (e.key === "ArrowLeft") keys.ArrowLeft = false;
            if (e.key === "ArrowUp" || e.key.toLowerCase() === 'w') keys.ArrowUp = false;
        });

        function getTerrain(x) {
            return canvas.height - 140 + Math.sin(x * 0.005) * 65 + Math.sin(x * 0.0015) * 45;
        }

        function generateWorldElements(carX) {
            let block = Math.floor(carX / 400);
            for (let i = block - 1; i <= block + 3; i++) {
                if (!spawnMarkers[i] && i > 0) {
                    spawnMarkers[i] = true;
                    let spawnX = i * 400 + Math.random() * 100;
                    if (i % 3 === 0) {
                        activeItems.push({ type: 'fuel', x: spawnX, y: 0, size: 14, collected: false });
                    } else {
                        activeItems.push({ type: 'coin', x: spawnX, y: 0, size: 8, collected: false });
                        activeItems.push({ type: 'coin', x: spawnX + 40, y: 0, size: 8, collected: false });
                    }
                    if (i > 1 && Math.random() < 0.5) {
                        let rand = Math.random();
                        if (rand < 0.5) {
                            obstacles.push({ type: 'log', x: spawnX + 160, y: 0, radius: 13, vx: 0, vy: 0, angle: 0 });
                        } else {
                            obstacles.push({ type: 'rock', x: spawnX + 190, y: 0, size: 28 });
                        }
                    }
                }
            }
        }

        function drawGauge(x, y, radius, value, minVal, maxVal, label, unit, color) {
            // Fundo do relógio
            ctx.fillStyle = "rgba(44, 62, 80, 0.85)";
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();

            // Linhas indicadoras internas
            ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
            for(let a = 0.75 * Math.PI; a <= 2.25 * Math.PI; a += 0.15 * Math.PI) {
                ctx.beginPath();
                ctx.arc(x, y, radius - 4, a, a + 0.02);
                ctx.stroke();
            }

            // Mapeia valor atual para o ângulo do ponteiro
            let percent = (value - minVal) / (maxVal - minVal);
            percent = Math.max(0, Math.min(1, percent)); // Trava entre 0 e 1
            let targetAngle = 0.75 * Math.PI + percent * (1.5 * Math.PI);

            // Desenha ponteiro vermelho analógico
            ctx.strokeStyle = color; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(targetAngle) * (radius - 12), y + Math.sin(targetAngle) * (radius - 12));
            ctx.stroke();

            // Centro do ponteiro
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();

            // Textos internos
            ctx.fillStyle = "#fff"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
            ctx.fillText(label, x, y + radius - 14);
            ctx.fillStyle = "#fffa65"; ctx.font = "11px Arial";
            ctx.fillText(Math.floor(value) + unit, x, y - 8);
        }

        function update() {
            if (!inGame) {
                requestAnimationFrame(update);
                return;
            }

            if (car.alive) {
                let fuelBurn = 0.07;
                if (keys.ArrowRight) {
                    fuelBurn = 0.15;
                    if(Math.random()<0.4) particles.push({ x: car.x - Math.cos(car.angle)*25, y: car.y - Math.sin(car.angle)*10, vx: -2, vy: -1, size: 5, alpha: 1 });
                }
                car.fuel -= fuelBurn;

                if (car.fuel <= 0) {
                    car.fuel = 0; car.alive = false;
                    failReasonEl.innerText = "SEM COMBUSTÍVEL!";
                    gameOverScreen.style.display = "flex";
                }

                if (car.isGrounded) {
                    if (keys.ArrowRight) car.vx += car.speed;
                    if (keys.ArrowLeft) car.vx -= car.speed * 0.5;
                    if (keys.ArrowUp) { car.vy = car.jumpForce; car.isGrounded = false; }
                } else {
                    if (keys.ArrowRight) car.vAngle += 0.01;
                    if (keys.ArrowLeft) car.vAngle -= 0.01;
                }
            }

            // Aplicar física
            car.vx *= car.friction; car.vy += car.gravity;
            car.angle += car.vAngle; car.vAngle *= 0.95;
            car.x += car.vx; car.y += car.vy;

            const groundY = getTerrain(car.x);
            const groundAheadY = getTerrain(car.x + 18);
            const groundBackY = getTerrain(car.x - 18);
            const targetAngle = Math.atan2(groundAheadY - groundBackY, 36);

            if (car.y + car.radius >= groundY) {
                car.y = groundY - car.radius;
                if (car.vy > 0) car.vy = car.vx * Math.sin(targetAngle);
                car.isGrounded = true;

                // Influência do Upgrade da suspensão (Estabiliza mais rápido nos níveis altos)
                let susFactor = 0.3 + (upgrades.sus * 0.06); 
                car.angle = car.angle * (1 - susFactor) + targetAngle * susFactor;
                car.vAngle *= 0.5;

                let normalAngle = car.angle % (Math.PI * 2);
                if (Math.abs(normalAngle) > 1.5 && Math.abs(normalAngle) < 4.7 && car.alive) {
                    car.alive = false;
                    failReasonEl.innerText = "MOTORISTA CAPOTOU!";
                    gameOverScreen.style.display = "flex";
                }
            } else {
                car.isGrounded = false;
            }

            // Medidor metros
            let currentDist = Math.floor(car.x / 10) - 20;
            if (currentDist > car.distance) { car.distance = currentDist; distScoreEl.innerText = car.distance; }

            generateWorldElements(car.x);

            // Obstáculos
            obstacles.forEach(obs => {
                if (obs.type === 'log') {
                    obs.vy += car.gravity; obs.vx *= 0.96; obs.x += obs.vx; obs.y += obs.vy;
                    let gY = getTerrain(obs.x);
                    if (obs.y + obs.radius >= gY) { obs.y = gY - obs.radius; obs.vy = 0; obs.vx += (getTerrain(obs.x+5)-getTerrain(obs.x-5))*0.15; obs.angle += obs.vx*0.05; }
                } else {
                    obs.y = getTerrain(obs.x) - obs.size/2;
                }
                let dist = Math.abs(car.x - obs.x);
                let size = obs.type === 'log' ? obs.radius*2 : obs.size;
                if (dist < car.width/2 + size/2 && Math.abs(car.y - obs.y) < size + 10) {
                    if (obs.type === 'log') { obs.vx = car.vx*1.3; car.vx *= 0.75; }
                    else { car.vx *= -0.2; car.vAngle += 0.04; }
                }
            });

            // Coleta itens
            activeItems.forEach(item => {
                if (!item.y_fixed) { item.y = getTerrain(item.x) - (item.type==='fuel'?25:20); item.y_fixed = true; }
                if (!item.collected && Math.abs(car.x - item.x) < 30 && Math.abs(car.y - item.y) < 30) {
                    item.collected = true;
                    if (item.type === 'coin') { car.coins += 500; coinScoreEl.innerText = car.coins; }
                    else { car.fuel = Math.min(100, car.fuel + 50); fuelGaugeEl.style.background = "#2ecc71"; }
                }
            });

            // Limpezas e Fumaça
            activeItems = activeItems.filter(item => item.x > car.x - 400);
            obstacles = obstacles.filter(obs => obs.x > car.x - 400);
            particles.forEach((p, idx) => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.02; if(p.alpha<=0) particles.splice(idx,1); });

            fuelGaugeEl.style.width = car.fuel + "%";
            if (car.fuel < 25) fuelGaugeEl.style.background = "#e74c3c";

            // --- DESENHAR TELAS ---
            ctx.fillStyle = "#74b9ff"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-car.x + 200, 0);

            // Terra e grama
            ctx.beginPath(); ctx.fillStyle = "#795548";
            for (let x = car.x - 300; x < car.x + 1000; x += 5) { let ty = getTerrain(x); if (x === car.x - 300) ctx.moveTo(x, canvas.height); ctx.lineTo(x, ty); }
            ctx.lineTo(car.x + 1000, canvas.height); ctx.fill();

            ctx.beginPath(); ctx.strokeStyle = "#27ae60"; ctx.lineWidth = 6;
            for (let x = car.x - 300; x < car.x + 1000; x += 5) { let ty = getTerrain(x); if (x === car.x - 300) ctx.moveTo(x, ty); ctx.lineTo(x, ty); }
            ctx.stroke();

            // Desenhar itens coletáveis e obstáculos
            activeItems.forEach(item => {
                if (!item.collected) {
                    if (item.type === 'coin') { ctx.fillStyle = "#f1c40f"; ctx.beginPath(); ctx.arc(item.x, item.y, item.size, 0, Math.PI*2); ctx.fill(); }
                    else { ctx.fillStyle = "#e74c3c"; ctx.fillRect(item.x-10, item.y-12, 20, 24); }
                }
            });
            obstacles.forEach(obs => {
                ctx.save(); ctx.translate(obs.x, obs.y);
                if(obs.type === 'log') { ctx.rotate(obs.angle); ctx.fillStyle = "#A0522D"; ctx.beginPath(); ctx.arc(0,0,obs.radius,0,Math.PI*2); ctx.fill(); }
                else { ctx.fillStyle = "#7f8c8d"; ctx.fillRect(-obs.size/2, -obs.size/2, obs.size, obs.size); }
                ctx.restore();
            });

            // Fumaça particles
            particles.forEach(p => { ctx.fillStyle = `rgba(140,140,140,${p.alpha})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });

            // Carro
            ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle);
            ctx.fillStyle = "#c0392b"; ctx.fillRect(-car.width/2, -car.height, car.width, car.height);
            ctx.fillStyle = "#e74c3c"; ctx.fillRect(-car.width/2, -car.height-6, 18, 6);
            ctx.fillStyle = "#3498db"; ctx.fillRect(8, -car.height-12, 14, 12);
            ctx.fillStyle = "#2c3e50"; ctx.beginPath(); ctx.arc(-car.width/3, 2, car.radius, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(car.width/3, 2, car.radius, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            ctx.restore();

            // --- DESENHAR RELÓGIOS ANALÓGICOS (VELOCÍMETRO / RPM) FIXOS NA TELA ---
            let speedKmh = Math.abs(car.vx) * 160; // Conversão simulada baseada na física do vetor X
            let mockRPM = keys.ArrowRight ? 3000 + (speedKmh * 35) : 900 + (speedKmh * 15);
            if (!car.isGrounded && keys.ArrowRight) mockRPM = 7500 + Math.random() * 500; // Cortando giro no ar!

            drawGauge(360, canvas.height - 55, 42, speedKmh, 0, 180, "SPEED", " km/h", "#e67e22");
            drawGauge(540, canvas.height - 55, 42, mockRPM, 0, 8000, "RPM", "", "#e74c3c");

            requestAnimationFrame(update);
        }

        // Executa carregamento inicial do sistema de upgrades
        updateGarageUI();
        update();
    </script>
</body>
</html>
